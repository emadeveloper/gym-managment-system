spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/backend_test_db
    driver-class-name: org.postgresql.Driver
    username: backend_user
    password: backend_password

  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  jwt:
    secret: testSecretKeyForTestingPurposesOnly12345678901234567890123456789012345678901234567890
    expiration: 86400000

  logging:
    level:
      com.backend: WARN
      org.springframework: WARN
      org.hibernate: WARN
      org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer: ERROR

  springdoc:
    api-docs:
      enabled: false
    swagger-ui:
      enabled: false