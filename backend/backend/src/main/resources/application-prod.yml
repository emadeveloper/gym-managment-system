spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com.backend: INFO
    org.springframework: WARN
    org.hibernate: WARN
    org.springframework.security.config.annotation.authentication.configuration: ERROR
mercadopago:
  enabled: ${MERCADOPAGO_ENABLED:false}
  access-token: ${MERCADOPAGO_ACCESS_TOKEN:}
  webhook-secret: ${MERCADOPAGO_WEBHOOK_SECRET:}
  base-url: ${MERCADOPAGO_BASE_URL:https://api.mercadopago.com}
  back-url: ${MERCADOPAGO_BACK_URL:}
  default-plan-code: ${MERCADOPAGO_DEFAULT_PLAN_CODE:monthly-standard}
  default-plan-name: ${MERCADOPAGO_DEFAULT_PLAN_NAME:Membresia mensual}
  currency-id: ${MERCADOPAGO_CURRENCY_ID:ARS}
  transaction-amount: ${MERCADOPAGO_TRANSACTION_AMOUNT:25000}
  frequency: ${MERCADOPAGO_FREQUENCY:1}
  frequency-type: ${MERCADOPAGO_FREQUENCY_TYPE:months}
