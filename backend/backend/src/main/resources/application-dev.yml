spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/backend_db
    driver-class-name: org.postgresql.Driver
    username: backend_user
    password: backend_password
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  jwt:
    secret: ${JWT_SECRET:defaultSecretKeyOnlyForDevPleaseChangeInProduction}
    expiration: ${JWT_EXPIRATION:86400000}

  logging:
    level:
      com.backend: DEBUG
      org.springframework.security: INFO
      org.springframework.security.config.annotation.authentication.configuration: ERROR

  springdoc:
    api-docs:
      enabled: true
    swagger-ui:
      enabled: true
      path: /swagger-ui.html