spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5434/la_resistencia_db}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USERNAME:admin}
    password: ${DATABASE_PASSWORD:admin123}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8081}

jwt:
  secret: ${JWT_SECRET:RGVmYXVsdFNlY3JldEtleU9ubHlGb3JEZXZQbGVhc2VDaGFuZ2VJblByb2R1Y3Rpb24=}
  expiration: ${JWT_EXPIRATION:86400000}

logging:
  level:
    com.backend: DEBUG
    org.springframework.security: INFO
    org.springframework.security.config.annotation.authentication.configuration: ERROR

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

mercadopago:
  enabled: ${MERCADOPAGO_ENABLED:false}
  access-token: ${MERCADOPAGO_ACCESS_TOKEN:}
  webhook-secret: ${MERCADOPAGO_WEBHOOK_SECRET:}
  base-url: ${MERCADOPAGO_BASE_URL:https://api.mercadopago.com}
  back-url: ${MERCADOPAGO_BACK_URL:http://localhost:5173/dashboard}
  default-plan-code: ${MERCADOPAGO_DEFAULT_PLAN_CODE:monthly-standard}
  default-plan-name: ${MERCADOPAGO_DEFAULT_PLAN_NAME:Membresia mensual}
  currency-id: ${MERCADOPAGO_CURRENCY_ID:ARS}
  transaction-amount: ${MERCADOPAGO_TRANSACTION_AMOUNT:25000}
  frequency: ${MERCADOPAGO_FREQUENCY:1}
  frequency-type: ${MERCADOPAGO_FREQUENCY_TYPE:months}
