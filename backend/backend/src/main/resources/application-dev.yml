spring:
  # ============ DATABASE ============
  datasource:
    url: jdbc:postgresql://localhost:5434/la_resistencia_db
    driver-class-name: org.postgresql.Driver
    username: admin
    password: admin123
  # ============ JPA/HIBERNATE ============
  jpa:
    platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  # ============ JWT Json Web Token Keys ============
  jwt:
    secret: ${JWT_SECRET:defaultSecretKeyOnlyForDevPleaseChangeInProduction}
    expiration: ${JWT_EXPIRATION:86400000}

  # ============ LOGGING ============
  logging:
    level:
      com.backend: DEBUG
      org.springframework.security: INFO
      org.springframework.security.config.annotation.authentication.configuration: ERROR

  springdoc:
    api-docs:
      enabled: true
    swagger-ui:
      enabled: true
      path: /swagger-ui.html